version: '3.8'

# Before running: copy src/main/resources/config.local.properties.example
# to config.local.properties and fill in your real app.url / admin credentials.
# That file is git-ignored, so secrets never get committed or pushed.
services:
  orangehrm-tests:
    build: .
    container_name: orangehrm-maven-demo
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: mvn clean test -Dheadless=true
